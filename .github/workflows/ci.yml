name: Order Service CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Stage 1: Unit Tests
  # ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test -Dtest="*Test,*Tests,!*PactTest,!*ComponentTest" -DfailIfNoTests=true

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: target/surefire-reports/

  # ────────────────────────────────────────────────────────────
  # Stage 2: Pact Contract Tests
  # Checks out both services so provider verification can
  # load pact files generated by the other service's consumer.
  # ────────────────────────────────────────────────────────────
  pact-contract-tests:
    name: Pact Contract Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout order-service
        uses: actions/checkout@v5
        with:
          path: order-service

      # Required for provider pact verification — loads pact files
      # from product-service/target/pacts.
      # For private repos, set a CROSS_REPO_TOKEN secret with repo access.
      - name: Checkout product-service
        uses: actions/checkout@v5
        with:
          repository: boschtech/product-service
          path: product-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      # Required for provider pact verification — loads pact files
      # from micro-frontend/pacts.
      - name: Checkout micro-frontend
        uses: actions/checkout@v5
        with:
          repository: boschtech/micro-frontend
          path: micro-frontend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            order-service/pom.xml
            product-service/pom.xml

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: micro-frontend/package-lock.json

      - name: Generate micro-frontend Consumer Pacts
        working-directory: micro-frontend
        run: npm ci && npm run test:contract

      - name: Run Consumer Pact Tests
        working-directory: order-service
        run: mvn test -Dtest="*ConsumerPactTest" -DfailIfNoTests=true

      - name: Generate product-service Consumer Pacts
        working-directory: product-service
        run: mvn test -Dtest="*ConsumerPactTest" -DfailIfNoTests=true

      - name: Run Provider Pact Verification
        working-directory: order-service
        run: mvn test -Dtest="*ProviderPactTest" -DfailIfNoTests=true

      - name: Upload Pact Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pact-test-reports
          path: |
            order-service/target/surefire-reports/
            order-service/target/pacts/

  # ────────────────────────────────────────────────────────────
  # Stage 3: Component Tests
  # Full Spring Boot application tests over HTTP.
  # ────────────────────────────────────────────────────────────
  component-tests:
    name: Component Tests
    needs: pact-contract-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Component Tests
        run: mvn test -Dtest="*ComponentTest" -DfailIfNoTests=true

      - name: Upload Component Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: component-test-reports
          path: target/surefire-reports/

  # ────────────────────────────────────────────────────────────
  # Stage 3b: Code Coverage (runs in parallel with Component Tests)
  #
  # Runs unit + component tests with JaCoCo and enforces the 95%
  # coverage thresholds configured in `pom.xml` (jacoco:check).
  # Pact provider tests are excluded because they require pacts
  # produced by other services (handled in Stage 2).
  # The `mvn verify` goal triggers the `coverage-check` execution
  # which fails the job — and the pipeline — if any JaCoCo metric
  # (instruction / line / branch) drops below 95%.
  # ────────────────────────────────────────────────────────────
  coverage:
    name: Code Coverage (>= 95%)
    needs: pact-contract-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests with Coverage and Enforce 95% Threshold
        run: mvn -B verify -Dtest="*Test,*Tests,*ComponentTest,!*PactTest" -DfailIfNoTests=false

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          retention-days: 14

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-surefire-reports
          path: target/surefire-reports/

  # ────────────────────────────────────────────────────────────
  # Stage 4: Security Penetration Testing
  # ────────────────────────────────────────────────────────────
  security-scan:
    name: Security Penetration Test
    needs: [component-tests, coverage]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cidb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/cidb
      DATABASE_USERNAME: ci
      DATABASE_PASSWORD: ci

    steps:
      - name: Checkout order-service
        uses: actions/checkout@v5
        with:
          path: order-service

      - name: Checkout product-service
        uses: actions/checkout@v5
        with:
          repository: boschtech/product-service
          path: product-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout micro-frontend
        uses: actions/checkout@v5
        with:
          repository: boschtech/micro-frontend
          path: micro-frontend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout security-pentest
        uses: actions/checkout@v5
        with:
          repository: boschtech/security-pentest
          path: security-pentest
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            order-service/pom.xml
            product-service/pom.xml

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            micro-frontend/package-lock.json
            security-pentest/package-lock.json

      - name: Build services and frontend
        run: |
          mvn -f order-service/pom.xml package -DskipTests -B -q
          mvn -f product-service/pom.xml package -DskipTests -B -q
          (cd micro-frontend && npm ci && VITE_PRODUCT_SERVICE_URL=http://localhost:8080 VITE_ORDER_SERVICE_URL=http://localhost:8081 VITE_API_KEY=${API_KEY:-changeme-dev-only} npm run build)

      - name: Start stack
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          ORDER_SERVICE_URL: http://localhost:8081
          PRODUCT_SERVICE_URL: http://localhost:8080
        run: |
          nohup java -jar product-service/target/*.jar > /tmp/product.log 2>&1 &
          nohup java -jar order-service/target/*.jar > /tmp/order.log 2>&1 &
          nohup npx --yes serve -s micro-frontend/dist -l 3000 > /tmp/frontend.log 2>&1 &

      - name: Wait for services
        run: |
          for url in http://localhost:8080/actuator/health http://localhost:8081/actuator/health http://localhost:3000; do
            for i in $(seq 1 60); do curl -sf "$url" > /dev/null 2>&1 && break || sleep 2; done
          done

      - name: Install pentest dependencies
        working-directory: security-pentest
        run: npm ci

      - name: Run Security Scan
        working-directory: security-pentest
        env:
          PRODUCT_SERVICE_URL: http://localhost:8080
          ORDER_SERVICE_URL: http://localhost:8081
          FRONTEND_URL: http://localhost:3000
          PENTEST_API_KEY: ${{ secrets.API_KEY || 'changeme-dev-only' }}
        run: npm run scan

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-pentest-report
          path: security-pentest/reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Stage 5: E2E Tests (@order-service) against a locally
  # deployed stack (product-service + order-service + micro-frontend)
  # running on the GitHub Actions runner.
  # ────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (@order-service)
    needs: [component-tests, coverage]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cidb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/cidb
      DATABASE_USERNAME: ci
      DATABASE_PASSWORD: ci

    steps:
      - name: Checkout order-service
        uses: actions/checkout@v5
        with:
          path: order-service

      - name: Checkout product-service
        uses: actions/checkout@v5
        with:
          repository: boschtech/product-service
          path: product-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout micro-frontend
        uses: actions/checkout@v5
        with:
          repository: boschtech/micro-frontend
          path: micro-frontend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout ui-playwright-automation
        uses: actions/checkout@v5
        with:
          repository: boschtech/ui-playwright-automation
          path: ui-playwright-automation
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            order-service/pom.xml
            product-service/pom.xml

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            micro-frontend/package-lock.json
            ui-playwright-automation/package-lock.json

      - name: Build order-service JAR
        working-directory: order-service
        run: mvn package -DskipTests -B

      - name: Build product-service JAR
        working-directory: product-service
        run: mvn package -DskipTests -B

      - name: Install micro-frontend deps
        working-directory: micro-frontend
        run: npm ci

      - name: Build micro-frontend
        working-directory: micro-frontend
        env:
          VITE_PRODUCT_SERVICE_URL: http://localhost:8080
          VITE_ORDER_SERVICE_URL: http://localhost:8081
          VITE_API_KEY: ${{ secrets.API_KEY || 'changeme-dev-only' }}
        run: npm run build

      - name: Start product-service
        working-directory: product-service
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          ORDER_SERVICE_URL: http://localhost:8081
        run: |
          nohup java -jar target/*.jar > product-service.log 2>&1 &
          echo $! > /tmp/product-service.pid

      - name: Start order-service
        working-directory: order-service
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          PRODUCT_SERVICE_URL: http://localhost:8080
        run: |
          nohup java -jar target/*.jar > order-service.log 2>&1 &
          echo $! > /tmp/order-service.pid

      - name: Serve micro-frontend
        working-directory: micro-frontend
        run: |
          nohup npx --yes serve -s dist -l 3000 > micro-frontend.log 2>&1 &
          echo $! > /tmp/micro-frontend.pid

      - name: Wait for services to be healthy
        run: |
          wait_for() {
            local url=$1
            echo "Waiting for $url"
            for i in $(seq 1 60); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "✅ $url is up"
                return 0
              fi
              sleep 2
            done
            echo "❌ Timed out waiting for $url"
            return 1
          }
          wait_for http://localhost:8080/actuator/health
          wait_for http://localhost:8081/actuator/health
          wait_for http://localhost:3000

      # ── AI: Restore cross-run history and contracts from cache ──
      - name: Restore AI history/contracts cache
        uses: actions/cache@v5
        with:
          path: |
            ui-playwright-automation/ai/history
            ui-playwright-automation/ai/contracts
          key: ai-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-data-${{ github.ref_name }}-
            ai-data-main-

      - name: Install Playwright deps
        if: always()  # ensure packages are installed even if a prior step fails
        working-directory: ui-playwright-automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui-playwright-automation
        run: npx playwright install --with-deps

      # ── AI: Smart regression selection (optional) ──
      - name: AI - Smart Regression Selection
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          GREP_ARGS=$(npx tsx ai/scripts/select-regression.ts --output-args 2>/dev/null || true)
          echo "AI_GREP_ARGS=$GREP_ARGS" >> $GITHUB_ENV
          echo "Regression selection: $GREP_ARGS"

      - name: Run Order Service E2E Tests
        working-directory: ui-playwright-automation
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: true
        run: npx playwright test --grep @order-service ${{ env.AI_GREP_ARGS }}

      # ── AI: Post-test analysis pipeline ──
      - name: AI - Failure RCA
        if: failure() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/analyze-failures.ts || true

      - name: AI - Flaky Test Detection
        if: always() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/detect-flaky.ts || true

      - name: AI - Auto-Create Defects
        if: failure() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx ai/scripts/create-defects.ts || true

      - name: AI - Validate API Contracts
        if: always() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/validate-contracts.ts || true

      - name: Clear API captures for next run
        if: always()
        working-directory: ui-playwright-automation
        run: rm -f ai/history/api-captures.json || true

      - name: Save AI history/contracts cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ui-playwright-automation/ai/history
            ui-playwright-automation/ai/contracts
          key: ai-data-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload AI Analysis Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-analysis-reports
          path: |
            ui-playwright-automation/ai/history/
            ui-playwright-automation/ai/contracts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ui-playwright-automation/playwright-report/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: ui-playwright-automation/test-results/
          retention-days: 14

      - name: Upload Service Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: service-logs
          path: |
            product-service/product-service.log
            order-service/order-service.log
            micro-frontend/micro-frontend.log
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          for pidfile in /tmp/product-service.pid /tmp/order-service.pid /tmp/micro-frontend.pid; do
            [ -f "$pidfile" ] && kill "$(cat "$pidfile")" 2>/dev/null || true
          done

